# .github/workflows/ci.yml
name: CI/CD

on:
  push:
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: API
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: API/package-lock.json

      - run: npm install -g npm@11

      - run: npm ci

      - name: Syntax check
        run: git ls-files '*.js' | grep -v node_modules | xargs -n1 node --check

      - name: Audit dependencies
        run: |
          for i in 1 2 3; do
            out=$(npm audit --audit-level=high 2>&1) && { echo "$out"; exit 0; }
            echo "$out"
            # npm exits 1 both for real vulns and for endpoint errors; tell them apart by the message
            if ! echo "$out" | grep -qiE 'audit endpoint returned an error|Service Unavailable|Bad Request|ECONNRESET|ETIMEDOUT'; then
              exit 1  # genuine vulnerabilities at/above high
            fi
            echo "audit endpoint error (attempt $i), retrying in 30s..."
            sleep 30
          done
          echo "::warning::npm audit endpoint unavailable after 3 attempts, skipping"

      # Pure-logic self-checks (node --check-style asserts), no server needed.
      - name: Unit tests
        run: |
          npm run test:auth
          npm run test:gigs
          npm run test:bookings
          npm run test:income
          npm run test:sanitize

      - name: Boot API and run Postman/Newman tests
        env:
          PORT: 3443
          JWT_SECRET: ci-smoke-secret-this-needs-to-be-32-characters-long-to-pass-added-verification
          SSL_KEY_PATH: ./certs/key.pem
          SSL_CERT_PATH: ./certs/cert.pem
          MONGO_URL: mongodb://localhost:27017/hustlehub-ci
          CORS_ORIGIN: https://localhost:5173
          APP_NAME: HustleHubPlusAPI
          # The collection authenticates with bearer tokens (it disables the
          # cookie jar per request), so register/login must echo the token in
          # the body. The API starts fresh each run: the rate limiters are
          # per process, and the collection uses up some of their allowance.
          EXPOSE_TOKEN_IN_BODY: "true"
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout certs/key.pem -out certs/cert.pem -subj "/CN=localhost"
          node server.js &
          PID=$!
          for i in $(seq 1 20); do
            curl -ksf https://localhost:3443/health && break || sleep 1
          done
          curl -ksf https://localhost:3443/health
          npm run test:api
          kill $PID

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Vitest 5 and jsdom 30 need Node 22+ (Node 20 crashes loading undici).
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --error fails the job on any finding; the reports upload either way.
      - name: Semgrep
        run: |
          mkdir -p reports
          chmod 777 reports
          docker run --rm -v "$PWD:/src" semgrep/semgrep semgrep scan --error \
            --config p/javascript --config p/nodejs --config p/expressjs --config p/react \
            --config p/secrets --config p/dockerfile --config p/github-actions \
            --text-output=reports/semgrep.txt --sarif-output=reports/semgrep.sarif

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semgrep-report
          path: reports/

  docker-zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Throwaway values for this run. The key must be world-readable because
      # the api container runs as the node user, not as the runner's user.
      - name: Create certificate and env files
        run: |
          mkdir -p API/certs reports
          chmod 777 reports
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout API/certs/key.pem -out API/certs/cert.pem -subj "/CN=localhost"
          chmod 644 API/certs/key.pem
          printf 'MONGO_USER=ci\nMONGO_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env
          printf 'JWT_SECRET=%s\nAPP_NAME=HustleHubPlusAPI\nCORS_ORIGIN=https://localhost:5173\n' \
            "$(openssl rand -hex 32)" > API/.env

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: |
          docker compose up -d
          for url in https://localhost:3443/health https://localhost:5173; do
            for i in $(seq 1 30); do
              curl -ksf "$url" > /dev/null && break || sleep 2
            done
            curl -ksf "$url" > /dev/null
          done

      # Passive baseline scan. -I reports warnings without failing the job, so
      # read the report; only a FAIL rule or a scan error turns this red.
      - name: ZAP baseline scan (API)
        run: |
          docker run --rm --network host -v "$PWD/reports:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t https://localhost:3443 -I -r zap-api.html -J zap-api.json

      - name: ZAP baseline scan (client)
        if: always()
        run: |
          docker run --rm --network host -v "$PWD/reports:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t https://localhost:5173 -I -r zap-client.html -J zap-client.json

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-reports
          path: reports/

  deploy:
    needs: [backend-test, frontend-build, static-analysis, docker-zap]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "Add real deploy step here (SSH / render / fly / etc.)"
