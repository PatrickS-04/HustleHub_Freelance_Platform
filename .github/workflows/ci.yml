# .github/workflows/ci.yml
name: CI/CD

on:
  push:
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: API
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: API/package-lock.json

      - run: npm install -g npm@11

      - run: npm ci

      - name: Syntax check
        run: git ls-files '*.js' | grep -v node_modules | xargs -n1 node --check

      - name: Audit dependencies
        run: |
          for i in 1 2 3; do
            out=$(npm audit --audit-level=high 2>&1) && { echo "$out"; exit 0; }
            echo "$out"
            # npm exits 1 both for real vulns and for endpoint errors; tell them apart by the message
            if ! echo "$out" | grep -qiE 'audit endpoint returned an error|Service Unavailable|Bad Request|ECONNRESET|ETIMEDOUT'; then
              exit 1  # genuine vulnerabilities at/above high
            fi
            echo "audit endpoint error (attempt $i), retrying in 30s..."
            sleep 30
          done
          echo "::warning::npm audit endpoint unavailable after 3 attempts, skipping"

      # Pure-logic self-checks (node --check-style asserts), no server needed.
      - name: Unit tests
        run: |
          npm run test:auth
          npm run test:gigs
          npm run test:bookings
          npm run test:income
          npm run test:sanitize

      - name: Boot API and run Postman/Newman tests
        env:
          PORT: 3443
          JWT_SECRET: ci-smoke-secret-this-needs-to-be-32-characters-long-to-pass-added-verification
          SSL_KEY_PATH: ./certs/key.pem
          SSL_CERT_PATH: ./certs/cert.pem
          MONGO_URL: mongodb://localhost:27017/hustlehub-ci
          CORS_ORIGIN: https://localhost:5173
          APP_NAME: HustleHubPlusAPI
          # Newman has no cookie jar, so the login/register response must
          # echo the token in the body for /me to be testable.
          EXPOSE_TOKEN_IN_BODY: "true"
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout certs/key.pem -out certs/cert.pem -subj "/CN=localhost"
          node server.js &
          PID=$!
          for i in $(seq 1 20); do
            curl -ksf https://localhost:3443/health && break || sleep 1
          done
          curl -ksf https://localhost:3443/health
          npm run test:api
          kill $PID

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # environment: production
    steps:
      - uses: actions/checkout@v4
      - run: echo "Add real deploy step here (SSH / render / fly / etc.)"
