# api + client + mongo. Mongo sits on an internal-only network: no published
# port and no route out, so only the api container can reach it.
# Secrets: MONGO_USER / MONGO_PASSWORD in ./.env, the rest in API/.env.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set MONGO_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    networks: [data]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./API
    restart: unless-stopped
    env_file: ./API/.env
    environment:
      # Overrides API/.env so the api talks to the mongo container, with auth.
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/hustlehub?authSource=admin
      SSL_KEY_PATH: /app/certs/key.pem
      SSL_CERT_PATH: /app/certs/cert.pem
      PORT: 3443
    volumes:
      - ./API/certs:/app/certs:ro
    ports:
      - "3443:3443"
    depends_on:
      mongo:
        condition: service_healthy
    networks: [data, public]

  client:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://localhost:3443
    restart: unless-stopped
    volumes:
      - ./API/certs:/etc/nginx/certs:ro
    # Port 5173 on the host keeps the origin the API's CORS allow-list expects.
    ports:
      - "5173:443"
    depends_on: [api]
    networks: [public]

networks:
  data:
    internal: true
  public:

volumes:
  mongo-data:
